##################################
# Universal Macros Config
#######################################

#########################################
# Universal PID Autotune
#########################################

[gcode_macro PID_AUTO_TUNE]
description: Autotune PID for a specific tool. Usage: PID_AUTO_TUNE TOOL=[t0|t1|t2|t3] TARGET=[temperature]
gcode:
    {% set tool_param = params.TOOL|default("t0")|lower %}
    {% set target_temp = params.TARGET|default(230)|int %}
    
    # Map t0 -> heater/fan info
    # Note: T0 usually uses 'extruder', T1 'extruder1', etc.
    {% set tool_map = {
        't0': {'heater': 'extruder',  'fan': 'Tool_0_partfan'},
        't1': {'heater': 'extruder1', 'fan': 'Tool_1_partfan'},
        't2': {'heater': 'extruder2', 'fan': 'Tool_2_partfan'},
        't3': {'heater': 'extruder3', 'fan': 'Tool_3_partfan'}
    } %}
    
    {% if tool_param not in tool_map %}
        {action_raise_error("Invalid TOOL parameter. Use t0, t1, t2, or t3.")}
    {% endif %}
    
    {% set info = tool_map[tool_param] %}
    
    M118 Starting PID Autotune for {tool_param} ({info.heater}) at {target_temp}C
    
    SET_FAN_SPEED FAN={info.fan} SPEED=1
    PID_CALIBRATE HEATER={info.heater} TARGET={target_temp}
    SET_FAN_SPEED FAN={info.fan} SPEED=0
    
    M118 PID Autotune for {tool_param} complete.

#########################################
# Universal Resonance Calibration Full
#########################################

[gcode_macro RESONANCE_CALIBRATION_FULL]
description: Run full resonance test (X and Y) for a specific tool. Usage: RESONANCE_CALIBRATION_FULL TOOL=[t0|t1|t2|t3]
gcode:
    {% set tool_param = params.TOOL|default("t0")|lower %}
    {% set xplorer = printer['gcode_macro _XPLORER_VARIABLES'] %}
    
    # Validate tool param via map check (simple existence check)
    {% set valid_tools = ['t0', 't1', 't2', 't3'] %}
    {% if tool_param not in valid_tools %}
        {action_raise_error("Invalid TOOL parameter. Use t0, t1, t2, or t3.")}
    {% endif %}
    
    M118 Starting Full Resonance Calibration for {tool_param}
    
    # Ensure tool is active (MEASURE_RESONANCES handles this too, but good to be explicit/safe)
    # Convert t0 -> T0
    {tool_param|upper}
    
    CHECK_HOME
    
    # Move to calibration position defined in variables
    G1 X{xplorer.res_x} Y{xplorer.res_y} F10000
    G1 Z{xplorer.res_z} F2000
    
    # Measure X
    MEASURE_RESONANCES AXIS=X TOOL={tool_param}
    
    # Measure Y
    MEASURE_RESONANCES AXIS=Y TOOL={tool_param}
    
    M118 Full Resonance Calibration for {tool_param} complete. Check PNG files.
