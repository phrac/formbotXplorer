##################################
# Universal Shell Commands Config
##################################

#######################################################
# Master Process Resonances Command
#######################################################

[gcode_shell_command process_resonances]
command: /bin/bash "$HOME/printer_data/config/0_Xplorer/.8_Scripts/process_resonances.sh"
timeout: 80
verbose: True

#######################################################
# Unified Measure Resonances Macro
#######################################################

[gcode_macro MEASURE_RESONANCES]
description: Measure resonances on a specific axis for a specific tool. Usage: MEASURE_RESONANCES AXIS=[X|Y] TOOL=[t0|t1|t2|t3]
gcode:
    {% set axis = params.AXIS|default("X")|upper %}
    {% set tool_param = params.TOOL|default("t0")|lower %}
    
    {% set tool_map = {
        't0': {'cmd': 'T0', 'accel': 'Tool0'},
        't1': {'cmd': 'T1', 'accel': 'Tool1'},
        't2': {'cmd': 'T2', 'accel': 'Tool2'},
        't3': {'cmd': 'T3', 'accel': 'Tool3'}
    } %}
    
    {% if tool_param not in tool_map %}
        {action_raise_error("Invalid TOOL parameter. Use t0, t1, t2, or t3.")}
    {% endif %}
    
    {% set tool_info = tool_map[tool_param] %}
    
    {tool_info.cmd}
    M118 Measuring resonances on {axis}-Axis for {tool_info.cmd}.
    M118 The process may take a few minutes, so be patient.
    CHECK_HOME
    G1 X210 Y200 F10000
    G1 Z50 F2000
    TEST_RESONANCES AXIS={axis} ACCELEROMETER={tool_info.accel}
    RUN_SHELL_COMMAND CMD=process_resonances PARAMS="{axis} {tool_param}"
    M118 Resonance test is complete. Check the PNG file for details.

#######################################################
# Master Flash Command
#######################################################

[gcode_shell_command flash_tool_universal]
command: sh $HOME/printer_data/config/0_Xplorer/.9_MCU_Flash/scripts/flash_mcus.sh
timeout: 300
verbose: True

#######################################################
# Unified Flash Macro
#######################################################

[gcode_macro FLASH_TOOL]
description: Flash the MCU for a specific tool. Usage: FLASH_TOOL TOOL=[t0|t1|t2|t3]
gcode:
    {% set tool_param = params.TOOL|default("t0")|lower %}
    
    # Map t0 -> Tool0 for the script argument
    {% set mcu_map = {
        't0': 'Tool0',
        't1': 'Tool1',
        't2': 'Tool2',
        't3': 'Tool3'
    } %}
    
    {% if tool_param not in mcu_map %}
        {action_raise_error("Invalid TOOL parameter. Use t0, t1, t2, or t3.")}
    {% endif %}
    
    {% set target_mcu = mcu_map[tool_param] %}
    
    M118 This will flash the {target_mcu} board with the latest Klipper firmware.
    M118 The process WILL STOP Klipper and take a few minutes.
    
    RUN_SHELL_COMMAND CMD=flash_tool_universal PARAMS="--targets {target_mcu}"
    
    M118 Flash process finished. Klipper should restart automatically.

