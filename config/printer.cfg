##################################
# Carriage Tool1
##################################

[carriage t0]
axis: x
endstop_pin:~Tool0:X_ENDSTOP
position_min: -1
position_endstop: 0
position_max: 340
homing_speed: 180
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10

[stepper x]
carriages: t0
step_pin: Tool0: X_E_STEP
dir_pin: !Tool0: X_E_DIR
enable_pin: !Tool0: X_E_EN
microsteps: 32
rotation_distance: 32

[tmc2209 stepper x]
uart_pin: Tool0: X_UART
run_current: 0.6
interpolate: false
sense_resistor: 0.11
stealthchop_threshold: 0
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 2
driver_HSTRT: 0

##################################
# Carriage Tool1
##################################

[dual_carriage t1]
primary_carriage: t0
safe_distance: 80
endstop_pin:~Tool1: X_ENDSTOP
position_min: 80
position_endstop: 421
position_max: 422
homing_speed: 180
homing_retract_dist: 5.0
homing_retract_speed: 50
second_homing_speed: 10

[stepper x1]
carriages: t1
step_pin: Tool1: X_E_STEP
dir_pin: !Tool1: X_E_DIR
enable_pin: !Tool1: X_E_EN
microsteps: 32
rotation_distance: 32

